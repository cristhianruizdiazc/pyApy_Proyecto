name: pyapy-staging

services:
  migrate:
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      SEED_DEMO: "false"
      WEB_ORIGIN: https://localhost:${STAGING_HTTPS_PORT:-8443}

  api:
    image: ${STAGING_API_IMAGE:-pyapy-staging-api:latest}
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      WEB_ORIGIN: https://localhost:${STAGING_HTTPS_PORT:-8443}
    expose:
      - "4100"

  web:
    image: ${STAGING_WEB_IMAGE:-pyapy-staging-web:latest}
    ports: !reset []
    expose:
      - "8080"

  gateway:
    image: caddy:2.10.2-alpine
    environment:
      STAGING_HOST: localhost
      STAGING_HTTPS_PORT: ${STAGING_HTTPS_PORT:-8443}
    ports:
      - "127.0.0.1:${STAGING_HTTPS_PORT:-8443}:${STAGING_HTTPS_PORT:-8443}"
    volumes:
      - ./docker/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test:
        [
          CMD,
          wget,
          --no-check-certificate,
          --quiet,
          --spider,
          "https://localhost:${STAGING_HTTPS_PORT:-8443}/api/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
